<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PG &amp; Research Department of Political Science – Library Book Search</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#16213a;--mute:#5b6679;--line:#d9dfe7;--accent:#0b6e6e;--accent-ink:#fff;--tag:#e3f1f1;--hl:#ffe58a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--ink:#e8edf6;--mute:#9aa6bb;--line:#2a3652;--accent:#4fc3bd;--accent-ink:#06222a;--tag:#1c3a46;--hl:#6b5a14}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI","Noto Sans Tamil","Latha",system-ui,sans-serif}
header{background:var(--ink);color:#fff;padding:22px 16px 74px}
@media (prefers-color-scheme:dark){header{background:#0a101c}}
.wrap{max-width:980px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px}
.ttl{flex:1;text-align:center}
.logo{height:86px;width:auto;max-width:96px;object-fit:contain;background:#fff;border-radius:10px;padding:4px;flex:none}
header .sub{margin-top:6px;color:#fff;font-weight:600}
@media (max-width:560px){.logo{height:56px;max-width:60px;padding:3px}.top{gap:8px}header h1{font-size:1.05rem!important}header p{font-size:.8rem!important}}
header h1{margin:0;font-size:1.5rem;font-weight:700;letter-spacing:.2px}
header p{margin:4px 0 0;color:#b9c4d9;font-size:.95rem}
.search{margin-top:-52px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:0 6px 18px rgba(10,20,40,.12)}
#q{width:100%;font:inherit;font-size:1.1rem;padding:13px 14px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#q:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;align-items:center}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.btn{font:inherit;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
#count{margin-left:auto;color:var(--mute);font-size:.95rem}
main{padding:16px 0 40px}
.book{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:8px;padding:12px 14px;margin:0 0 10px}
.book.ta{border-left-color:#b4542a}
.book h2{margin:0 0 2px;font-size:1.05rem;line-height:1.35}
.by{color:var(--mute);margin:0 0 8px;font-size:.95rem}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--mute)}
.meta b{color:var(--ink);font-weight:600}
.tag{background:var(--tag);color:var(--ink);border-radius:20px;padding:1px 10px;font-size:.8rem}
mark{background:var(--hl);color:inherit;border-radius:2px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.more{display:block;margin:14px auto 0}
footer{text-align:center;color:var(--mute);font-size:.82rem;padding:0 12px 28px}
</style>
</head>

function draw(w){
 w=w||$('q').value.toLowerCase().split(/\s+/).filter(Boolean);
 $('count').textContent=res.length+' of '+D.length+' books';
 const part=res.slice(0,shown);
 $('list').innerHTML=part.length?part.map(b=>`<article class="book${b.l==='Tamil'?' ta':''}"><h2>${hl(b.t,w)}</h2><p class="by">${b.a?hl(b.a,w):'Author not listed'}</p><div class="meta"><span>Acc. No: <b>${hl(b.acc||'–',w)}</b></span><span>PS No: <b>${esc(b.ps||'–')}</b></span><span>${b.p?hl(b.p,w):'Publisher not listed'}</span><span>Year: <b>${esc(b.y||'–')}</b></span><span>Price: <b>${b.pr?'₹'+esc(b.pr):'–'}</b></span><span class="tag">${esc(b.l)}</span></div></article>`).join('')+(res.length>shown?'<button class="btn more" id="more" type="button">Show more</button>':''):'<p class="empty">No books found. Try fewer words or a different spelling.</p>';
